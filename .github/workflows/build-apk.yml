name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Add Firebase configuration
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Make Gradle wrapper executable
        if: ${{ hashFiles('gradlew') != '' }}
        run: chmod +x gradlew

      - name: Build Debug APK with wrapper
        if: ${{ hashFiles('gradlew') != '' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Debug APK without wrapper
        if: ${{ hashFiles('gradlew') == '' }}
        run: gradle assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sewangan-Vidyapeeth-Admin-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
