name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Firebase configuration
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Make Gradle wrapper executable
        if: ${{ hashFiles('gradlew') != '' }}
        run: chmod +x gradlew

      - name: Build APK with Gradle wrapper
        if: ${{ hashFiles('gradlew') != '' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build APK with installed Gradle
        if: ${{ hashFiles('gradlew') == '' }}
        run: gradle assembleDebug --stacktrace

      - name: Show generated APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sewangan-Vidyapeeth-Admin-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
